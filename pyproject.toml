[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uatd"
version = "0.1.0"
description = "Object detection on UATD forward-looking sonar images (CSE499A, NSU)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Md. Azmine Amin Mormo" }]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pycocotools>=2.0.7",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.5"]
# RF-DETR (Robinson et al., ICLR 2026), main pipeline. Pinned; training stack = PyTorch Lightning.
rfdetr = ["rfdetr[train]==1.12.1"]
# DEIM-D-FINE (CVPR 2025 / ICLR 2025), comparison row. The official repo is cloned at a
# pinned commit by uatd.deim_support; these are its requirements.txt plus gdown (weights).
deim = ["faster-coco-eval>=1.6.5", "calflops", "transformers", "tensorboard", "scipy", "gdown"]
# Further track extras (yolo, dome) are added with exact pins once each
# install is verified on Kaggle with a --smoke run (CLAUDE.md, Section 7).

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the raw UATD data or its cached index"]
